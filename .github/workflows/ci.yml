name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra cloud
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -p no:cacheprovider

  image:
    name: runtime image builds and becomes healthy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: mcp-jira:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name mj -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp \
            -e JIRA_SITE_URL=https://example.atlassian.net -e ATLASSIAN_CLIENT_ID=ci -e ATLASSIAN_CLIENT_SECRET=ci \
            mcp-jira:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/mcp)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Host: evil.example' localhost:8000/mcp)" = 421
